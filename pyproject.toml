[tool.poetry]
name = "push-notification-service"
version = "0.1.0"
description = "Сервис для отправки push-уведомлений через Firebase Cloud Messaging"
authors = ["Larisa Shirokikh <larisa.s@luminaryinc.com>"]
readme = "README.md"
packages = [{include = "push_service"}]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
firebase-admin = "^6.2.0"
python-dotenv = "^1.0.0"
kafka-python = "^2.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"